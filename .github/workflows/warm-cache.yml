name: Warm cache

# Warms the Cloudflare Worker HTML cache (x-kk-html-cache) per country.
# After each MISS it re-fetches once to confirm the edge stored the page.
#
# Prerequisites:
#   1) Deploy Worker v3+ (strategy-B/cloudflare-worker.js) — older workers
#      stored max-age=0 / Vary: Cookie and never rematched.
#   2) Cloudflare → Caching → Tiered Cache (Smart) + Cache Reserve
#      (Workers Cache API is per-colo; Actions only warms the runner’s colo).
#
# Requires kk-cache-warm.js at the repo root (SCRIPT below).

on:
  schedule:
    # Weekly — Sunday 12:00 IST (= 06:30 UTC).
    - cron: '30 6 * * 0'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Countries: zones | kk | popular | all | comma list'
        default: 'zones'
        type: string
      concurrency:
        description: 'Parallel requests (keep low — shared hosting overloads easily)'
        default: '2'
        type: string
      max:
        description: 'Max pages to discover'
        default: '5000'
        type: string
      base_url:
        description: 'Site base URL'
        default: 'https://kattankampany.com/'
        type: string
      verify:
        description: 'Run verify pass after warm (fail job if HIT rate low)'
        default: true
        type: boolean

concurrency:
  group: warm-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SCRIPT: kk-cache-warm.js
      BASE_URL: ${{ github.event.inputs.base_url || 'https://kattankampany.com/' }}
      COUNTRIES: ${{ github.event.inputs.countries || 'zones' }}
      CONCURRENCY: ${{ github.event.inputs.concurrency || '2' }}
      MAX: ${{ github.event.inputs.max || '5000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Warm cache
        run: |
          set -euo pipefail
          echo "Warming $BASE_URL  countries=$COUNTRIES  concurrency=$CONCURRENCY  max=$MAX"
          echo "Looking for x-kk-html-cache / x-kk-html-cache-put (Worker v3+)."
          VERIFY_FLAG=""
          if [ "${{ github.event.inputs.verify || 'true' }}" = "true" ]; then
            VERIFY_FLAG="--verify"
          fi
          node "$SCRIPT" "$BASE_URL" \
            --countries "$COUNTRIES" \
            --concurrency "$CONCURRENCY" \
            --max "$MAX" \
            --default-country IN \
            --confirm \
            $VERIFY_FLAG
