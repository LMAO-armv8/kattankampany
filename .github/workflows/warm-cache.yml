name: Warm cache

# Keeps the LiteSpeed + Cloudflare-Worker cache warm by crawling the site and
# fetching each page (per country). Runs on a schedule and can be triggered
# manually with custom options.
#
# Requires `kk-cache-warm.js` to exist in the repo (path set by SCRIPT below).

on:
  schedule:
    # Weekly — Sunday 12:00 IST (= 06:30 UTC; GitHub cron is UTC, IST = UTC+5:30).
    # Matches LiteSpeed's ~1-week page-cache lifetime. Trigger manually any time
    # via "Run workflow" below.
    - cron: '30 6 * * 0'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Countries: zones | kk | popular | all | comma list'
        default: 'zones'
        type: string
      concurrency:
        description: 'Parallel requests (keep low — shared hosting overloads easily)'
        default: '2'
        type: string
      max:
        description: 'Max pages to discover'
        default: '5000'
        type: string
      base_url:
        description: 'Site base URL'
        default: 'https://kattankampany.com/'
        type: string

# Never let two warm runs overlap (a slow run + the next schedule).
concurrency:
  group: warm-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub-hosted runners are hard-capped at 360 min/job
    env:
      SCRIPT: kk-cache-warm.js          # adjust if you put the file in a subfolder
      BASE_URL: ${{ github.event.inputs.base_url || 'https://kattankampany.com/' }}
      COUNTRIES: ${{ github.event.inputs.countries || 'zones' }}
      CONCURRENCY: ${{ github.event.inputs.concurrency || '2' }}
      MAX: ${{ github.event.inputs.max || '5000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Warm cache
        run: |
          echo "Warming $BASE_URL  countries=$COUNTRIES  concurrency=$CONCURRENCY  max=$MAX"
          node "$SCRIPT" "$BASE_URL" --countries "$COUNTRIES" --concurrency "$CONCURRENCY" --max "$MAX"
