name: wc_print_agent
description: WooCommerce Print Agent — local Windows print agent for the WooCommerce Print Management platform.
publish_to: "none"

# Displayed in the About / Diagnostics screen and sent to the server as app_version.
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- State management & DI -------------------------------------------------
  flutter_riverpod: ^2.6.1        # reactive UI state ONLY
  get_it: ^8.0.2                  # infrastructure/application services ONLY

  # ---- Routing ---------------------------------------------------------------
  go_router: ^14.6.1

  # ---- Models / serialization ------------------------------------------------
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ---- Networking ------------------------------------------------------------
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # ---- Local database --------------------------------------------------------
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.26   # bundles sqlite3.dll into the Windows build

  # ---- Windows platform ------------------------------------------------------
  win32: ^5.5.4
  ffi: ^2.1.3
  tray_manager: ^0.2.4
  window_manager: ^0.4.3

  # ---- Printing --------------------------------------------------------------
  printing: ^5.13.4               # PDFium rendering + direct-to-printer on Windows
  pdf: ^3.11.1                    # document composition for image/text/label output
  image: ^4.3.0                   # decode/transform for image + ESC/POS raster

  # ---- Platform utilities ----------------------------------------------------
  path_provider: ^2.1.5
  path: ^1.9.0
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  file_selector: ^1.0.3

  # ---- Misc ------------------------------------------------------------------
  crypto: ^3.0.6
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
